{% extends "base.html" %}

{% block title %}Join PVR Privilege | PVR INOX{% endblock %}

{% block content %}
<div class="container py-5 d-flex justify-content-center">
    <div class="card bg-card border border-warning border-opacity-25 rounded-4 p-4 p-md-5 shadow-2xl" style="max-width: 500px; width: 100%;">
        
        <div class="text-center mb-4">
            <div class="d-inline-flex mb-3">
                <div class="pvr-logo-box">
                    <span class="pvr-brand-text">PVR</span>
                    <span class="pvr-sub-brand">INOX</span>
                </div>
            </div>
            <h3 class="fw-bold text-light font-brand">Join PVR Privilege</h3>
            <p class="text-muted small">Unlock exclusive premiere invites, zero convenience fees, and reward points</p>
        </div>

        <form action="{{ url_for('auth.register') }}" method="POST">
            <div class="mb-3">
                <label class="form-label text-warning small fw-semibold">Full Name</label>
                <div class="input-group">
                    <span class="input-group-text bg-dark border-secondary border-opacity-50 text-muted"><i class="fa-solid fa-user"></i></span>
                    <input type="text" name="full_name" required class="form-control bg-dark text-light border-secondary border-opacity-50" placeholder="John Doe">
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label text-warning small fw-semibold">Email Address</label>
                <div class="input-group">
                    <span class="input-group-text bg-dark border-secondary border-opacity-50 text-muted"><i class="fa-solid fa-envelope"></i></span>
                    <input type="email" name="email" required class="form-control bg-dark text-light border-secondary border-opacity-50" placeholder="john@example.com">
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label text-warning small fw-semibold">Mobile Number</label>
                <div class="input-group">
                    <span class="input-group-text bg-dark border-secondary border-opacity-50 text-muted"><i class="fa-solid fa-phone"></i></span>
                    <input type="text" name="phone" class="form-control bg-dark text-light border-secondary border-opacity-50" placeholder="9876543210">
                </div>
            </div>

            <div class="mb-4">
                <label class="form-label text-warning small fw-semibold">Create Password</label>
                <div class="input-group">
                    <span class="input-group-text bg-dark border-secondary border-opacity-50 text-muted"><i class="fa-solid fa-lock"></i></span>
                    <input type="password" name="password" required class="form-control bg-dark text-light border-secondary border-opacity-50" placeholder="Create a secure password">
                </div>
            </div>

            <button type="submit" class="btn btn-gold w-100 rounded-pill py-2 fw-bold font-brand shadow mb-3">
                Create Account
            </button>
        </form>

        <div class="text-center text-muted small pt-2">
            Already have an account? <a href="{{ url_for('auth.login') }}" class="text-warning text-decoration-none fw-bold">Sign In</a>
        </div>

    </div>
</div>
{% endblock %}
